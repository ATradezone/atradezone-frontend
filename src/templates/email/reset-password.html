<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-[#f9fafd] flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-[#01363C] to-[#024a52] p-8 text-center">
                <div class="flex justify-between items-center">
                </div>
            </div>
            
            <div class="p-8 text-center">
                <div class="bg-gray-200 border-2 border-dashed rounded-xl w-16 h-16 mx-auto mb-6 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Reset Your Password</h2>
                <p class="text-gray-600 mb-8">
                    Hello {{username}},<br><br>
                    We received a request to reset your password. Click the button below to create a new password.
                </p>
                
                <a href="{{resetLink}}" class="button">Reset Password</a>
                
                <p class="text-gray-600 mt-8">
                    If you didn't request this, please ignore this email.
                </p>
            </div>
            
            <div class="bg-gray-50 px-8 py-6 text-center">
                <p class="text-[#01363C] text-sm">
                    &copy; <script>document.write(new Date().getFullYear());</script> ATradezone™ Cloud. All rights reserved.
                </p>
                <div class="mt-2">
                    <a href="{{privacyPolicyLink}}" class="text-[#01363C] hover:text-[#024a52] text-sm mr-4">Privacy Policy</a>
                    <a href="{{termsLink}}" class="text-[#01363C] hover:text-[#024a52] text-sm">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
